version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - DEBUG=1 #activer debogage
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-default-key-for-dev-only}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cinema}
    depends_on:
      - db

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cinema}

volumes:
  postgres_data:
